name: Check generated bundles

on:
  pull_request:
    paths:
      - package.json
      - src/**
      - dist/**
      - vite.config.js
      - .github/workflows/check-dist.yml
  push:
    paths:
      - package.json
      - src/**
      - dist/**
      - vite.config.js
      - .github/workflows/check-dist.yml

permissions: {}

jobs:
  check:
    name: Check dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      # This repository does not track package-lock.json. Keep this install
      # script-free and do not grant this job any publish credential.
      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Rebuild and compare dist
        run: |
          set -euo pipefail
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ changed when rebuilt. Commit the generated dist/ with the source change."
            git diff --stat -- dist/
            exit 1
          fi
